# ─── Questly Docker Compose ───────────────────────────────────────────────────
# Orchestrates all three services: MongoDB, backend API, and frontend.
# For local development, services communicate via Docker's internal network.
#
# Usage:
#   docker compose up --build          # Start everything (with rebuild)
#   docker compose down -v             # Stop and remove volumes
#   docker compose logs -f backend     # Tail backend logs

version: "3.9"

services:
  # ─── MongoDB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: questly-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: questly
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"          # Expose locally for Compass/debugging
    networks:
      - questly-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    container_name: questly-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy     # Wait until Mongo is ready before starting
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/questly   # Uses Docker service name
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES: 15m
      JWT_REFRESH_EXPIRES: 7d
    ports:
      - "5000:5000"
    networks:
      - questly-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Frontend (Nginx) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    container_name: questly-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - questly-net

# ─── Named Volumes ──────────────────────────────────────────────────────────
volumes:
  mongo_data:
    name: questly-mongo-data

# ─── Networks ────────────────────────────────────────────────────────────────
networks:
  questly-net:
    driver: bridge
